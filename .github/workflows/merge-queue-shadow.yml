name: Merge Queue (shadow eval)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft, review_requested]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  issues: write

concurrency:
  group: merge-queue
  cancel-in-progress: true

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: igorjs/gh-actions-merge-queue@425ab256b34b63d260e600da5773d0da277e96f0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          mode: shadow
          merge_method: squash
          status_context: merge-queue
          behind_max_commits: "100"
          clean_queue: "false"
          fastlane_matchers: "^(hotfix|critical|security)/,\\bhotfix\\b,^hotfix:"
