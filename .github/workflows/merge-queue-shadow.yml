name: Merge Queue (shadow eval)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft, review_requested]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  issues: write

concurrency:
  group: merge-queue
  cancel-in-progress: true

jobs:
  queue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # SHADOW EVAL: local patched copy (one-line eligibility patch) because
      # upstream's APPROVED-only gate is unsatisfiable in a single-identity
      # repo (GitHub 422s self-approval). Upstream SHA reference kept in the
      # report; this local copy is what actually runs here.
      - uses: ./.github/actions/merge-queue
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          mode: shadow
          merge_method: squash
          status_context: merge-queue
          behind_max_commits: "100"
          clean_queue: "false"
          fastlane_matchers: "^(hotfix|critical|security)/,\\bhotfix\\b,^hotfix:"
